

networks:
  cass-net:
    driver: bridge

services:
  cass1:
    image: cassandra:4.1
    container_name: cass1
    hostname: cass1
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=TestCluster
      - CASSANDRA_DC=dc1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=256M
      - HEAP_NEWSIZE=50M
    networks:
      - cass-net

  cass2:
    image: cassandra:4.1
    container_name: cass2
    hostname: cass2
    ports:
      - "9043:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=TestCluster
      - CASSANDRA_SEEDS=cass1
      - CASSANDRA_DC=dc1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=256M
      - HEAP_NEWSIZE=50M
    depends_on:
      - cass1
    networks:
      - cass-net
    cap_add:
      - NET_ADMIN

  cass3:
    image: cassandra:4.1
    container_name: cass3
    hostname: cass3
    ports:
      - "9044:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=TestCluster
      - CASSANDRA_SEEDS=cass1
      - CASSANDRA_DC=dc1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=256M
      - HEAP_NEWSIZE=50M
    depends_on:
      - cass1
    networks:
      - cass-net